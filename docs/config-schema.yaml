# =============================================================================
# Agent Knowledge Base — config.yaml schema draft
# Status: DRAFT for review (2026-09-05). No engine consumes this yet.
#
# Purpose: every corpus-specific fact the engine needs lives here (or under
# user_data/). Engine code contains ZERO references to corpus field names.
# Roles/use declarations below are the machine contract the engine reads.
#
# Conventions used in this draft:
#   * ${VAR}    -> environment-variable expansion (paths); relative paths are
#                  resolved against this config's directory.
#   * field type vocabulary:
#       text            scalar string, or list of strings, usable as content
#       string          single categorical value
#       list[string]    multi-value categorical
#       int / float     numeric
#       bool            boolean
#   * field roles (a field may have several):
#       retrieval       included in the searchable text blob (chunker source)
#       facet           filterable + groupable (single- or multi-valued)
#       metric          numeric; available for min/max filters + aggregation
#   * `weight` (optional, 0..1) tunes retrieval weighting; default 1.0.
# =============================================================================

# ---- Engine / runtime --------------------------------------------------------
engine:
  # Where generated artifacts go (canonical corpus, index DBs, materialized
  # views, eval reports). Kept out of src/ and out of user input. gitignored.
  artifacts_dir: artifacts
  # Root for user-supplied input (source exports + gold sets). Kept out of src/.
  user_data_dir: user_data
  default_corpus: uiux        # corpus used when a query omits corpus scope
  log_level: info

# ---- Embedding (global; per-corpus override supported under corpus.index) ----
embedding:
  provider: gemini            # gemini | voyage  (matches kb/dense providers today)
  model: gemini-embedding-2
  dims: 768                   # MRL truncation
  batch_documents: 25         # protects constrained free-tier quota
  max_retries: 6
  # Keyed by (text_hash, model, dims) so identical inputs are never re-billed.
  idempotent: true

# ---- Corpora -----------------------------------------------------------------
corpora:
  uiux:
    # --- Schema: the declared rich model. Thin envelope fields (id, content_hash,
    # provenance, text units) are engine-managed; you only declare which mapped
    # field is the identity and which content drives the dedupe/refresh hash.
    schema:
      id_field: post_id                 # stable record identity
      content_hash_fields: [summary, transcript, workflow_steps, tips]  # dedupe/refresh key
      fields:
        post_id:          { type: string }
        shortcode:        { type: string }
        url:              { type: string }
        owner:            { type: string, role: [facet] }            # "creator"
        content_type:     { type: string, role: [facet] }
        domains:          { type: list[string], role: [facet] }      # any-of filter
        is_educational:   { type: bool }
        value_score:      { type: int,    role: [metric] }           # min/max + aggregate
        gated_content:    { type: bool,   role: [facet] }
        gated_trigger:    { type: text }
        summary:          { type: text,   role: [retrieval], weight: 1.0 }
        transcript:       { type: text,   role: [retrieval], weight: 1.0 }
        workflow_steps:   { type: list[text], role: [retrieval] }
        tips:             { type: list[text], role: [retrieval] }
        concepts:         { type: list[string], role: [retrieval] }
        tools_apps:       { type: list[string], role: [facet] }     # declared, not hardcoded
        resources:        { type: list[object] }                     # passthrough; not indexed/filtered
        tags:             { type: list[string] }
        media_files:      { type: list[string] }
        media_ref:        { type: string }                           # pointer into byte cache
        extraction_status:{ type: string, role: [facet] }
        is_promo:         { type: bool,   role: [facet] }

    # --- Sources: multiple raw sources of related shape normalize onto the schema
    # above. One source = one adapter (the OCP extension point for novel formats).
    sources:
      - name: uiux-scrape
        adapter: ig_saved                # registered adapter id
        location: ${SCRAPE_REPO}/data/uiux
        snapshot: uiux-2026-09-01        # pinned; re-extraction = new snapshot
        mapping:
          # path.into.source -> corpus field. Supported transforms:
          #   identity, string, coerce_int, coerce_bool, list, source_metadata.
          id: { from: metadata.id, transform: string }
          shortcode: { from: metadata.shortCode, transform: string }
          url: { from: metadata, transform: derive_shortcode_url }   # small registered transform
          owner: { from: metadata.ownerUsername, transform: string }
          summary: { from: analysis.summary, transform: string }
          transcript: { from: analysis.transcript, transform: string }
          workflow_steps: { from: analysis.workflow_steps, transform: list }
          tips: { from: analysis.tips, transform: list }
          concepts: { from: analysis.concepts, transform: list }
          tools_apps: { from: analysis.tools_apps, transform: list }
          value_score: { from: analysis.value_score, transform: coerce_int }
          content_type: { from: analysis.content_type, transform: string }
          domains: { from: analysis.domains, transform: list }
          gated_content: { from: analysis.gated_content, transform: coerce_bool }
          tags: { from: metadata.hashtags, transform: list }
          media_ref: { from: metadata, transform: dataset_post_dir }
        provenance:
          source: scrape-ig-saved-list
          extractor_field: analysis.extractor_model   # version recorded, not assumed
          confidence_field: analysis.confidence
        dedupe:
          key: [post_id]                # collision across sources -> namespace prefix
          policy: keep_first            # keep_first | newest | highest_confidence | version_append
        missing: surface_as_gap          # surface_as_gap (abstention) | reject

      # A second source of a *different* shape that is still the same logical
      # corpus can be declared here with its own adapter + mapping + dedupe.
      # - name: uiux-manual-additions
      #   adapter: csv
      #   location: user_data/sources/uiux-manual.csv
      #   mapping: { ... maps its columns onto the same schema fields ... }

    # --- Index -----------------------------------------------------------------
    index:
      chunker:
        mode: by_field                 # by_field | by_size
        # Which fields chunk into the searchable text. Default: all role=retrieval
        # fields; explicit list overrides. Keeps chunk provenance (record_id, field).
        fields: [summary, transcript, workflow_steps, tips, concepts]
      tokenization:
        language: en
        # Engine-internal defaults for stopwords/token regex. NOT a first-class
        # user knob; override here only when a corpus genuinely needs it.
        stopwords: default              # advanced override
      retrieval:
        default: hybrid                 # bm25 | dense | hybrid
        strategies:
          bm25:  { backend: fts5 }
          dense: { provider: gemini, model: gemini-embedding-2, dims: 768 }
          hybrid:{ fusion: rrf, k: 60 } # RRF constant; fusion held until a
                                        # trigger fires (see architecture.md)
        rerank: disabled

    # --- Materialize: declarative aggregate views --------------------------------
    materialize:
      freshness: 24h                    # view refuses to serve past this age
      views:
        - name: top_creators
          group_by: [owner]
          metrics:
            - post_count: count
            - avg_value_score: mean(value_score)
            - educational_share: mean(is_educational)
          filters: { extraction_status: ok }
        - name: tools
          group_by: [tools_apps]        # unnest list facet, count posts
          metrics: [ { post_count: count } ]
        - name: by_domain
          group_by: [domains]
          metrics: [ { post_count: count }, { avg_value_score: mean(value_score) } ]

    # --- Verify: gold set + baseline + CI gate -----------------------------------
    verify:
      gold_set: user_data/gold/uiux-v1.json     # versioned, committed
      metrics: [recall@5, recall@10, ndcg@10, mrr]
      baseline: artifacts/verify/uiux-baseline.json   # committed separately in-repo
      gate:
        enabled: true
        # Fail build if a metric drops below baseline by more than this (absolute).
        regression_threshold: 0.02
        # CI cadence decision: small eval subset per-PR, full eval on merge.
        pr_subset_size: null            # null = use full gold set every PR

    # --- Serve: query defaults + abstention --------------------------------------
    serve:
      defaults: { top_k: 20, mode: hybrid }
      abstention:
        min_score: 2
        min_coverage: 0.6
      # Filter keys the CLI/query envelope will validate against. Anything else
      # -> clear error, never silent. Derived from role=facet/metric fields if
      # omitted; list here to narrow exposure.
      expose_facets: [owner, content_type, domains, tools_apps, gated_content]

  # --- A genuinely different schema = a sibling corpus (same engine, own config,
  # own gold set, own views). No force-normalization into the uiux shape.
  # creator-growth:
  #   schema: { ...its own fields... }
  #   sources: [...]
  #   index / materialize / verify / serve: same structure as above

# =============================================================================
# OPEN DECISIONS (from docs/productization-plan.md §12)
#   1. CI cadence: pr_subset_size=null (full every PR) vs a small subset per-PR
#      + full on merge. Recommended: small subset per-PR.
#   2. Per-corpus declarations here in root config.yaml (this draft) vs a
#      user_data/corpus.yaml per corpus. Split only if a second corpus appears.
#   3. Mapping transforms (`derive_shortcode_url`, `dataset_post_dir`) are a
#      small registered set; genuinely bespoke normalization beyond these belongs
#      in a per-source adapter (extension point), not an unbounded config DSL.
# =============================================================================
