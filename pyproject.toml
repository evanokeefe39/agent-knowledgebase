[project]
name = "agent-knowledgebase"
version = "0.1.0"
description = "Agent-queryable knowledge base derived from social media (UI/UX + creator-growth domains)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kb_engine", "kb"]
